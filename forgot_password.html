<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Kata Sandi</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <style>
      /* Gaya tambahan khusus untuk halaman ini */
      .login-form p {
        text-align: center;
        margin-bottom: 25px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <form id="forgotPasswordForm" class="login-form">
        <h2>Lupa Kata Sandi</h2>
        <p>
          Masukkan alamat email Anda yang terdaftar. Kami akan mengirimkan
          tautan untuk mengatur ulang kata sandi.
        </p>

        <div class="input-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <button type="submit" id="resetButton">Kirim Tautan Reset</button>
        <p class="error-message" id="errorMessage"></p>

        <div class="options">
          <a href="login.html">Kembali ke Login</a>
        </div>
      </form>
    </div>
    <script src="JS/forgot_password_script.js"></script>
  </body>
</html>
